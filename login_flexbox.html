<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
                body{
                        height: 100vh;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        
                }
                button{
                        width: 60px;
                        height: 20px;
                        border-radius: 10px;
                        background-color: rgb(104, 103, 103);
                        color: white;
                        border: none;
                        margin-top: 10px;
                }
                h3{
                     font-size: 25px; 
                     letter-spacing: 2px;  
                }
                div{
                        border-radius: 20px;
                        display: flex;
                        height: 400px;
                        width: 300px;
                        align-items: center;
                        justify-content: center;
                        background-color: lightgray;
                        flex-direction: column;
                        box-shadow: 0px 0px 10px rgb(111, 114, 144);

                }
                input{
                        width: 200px;
                        height: 25px;
                        border-radius: 10px;
                        border: none;
                        margin-bottom: 10px;
                }
                p{
                        width: 200px;
                        letter-spacing: 2px;
                }

        </style>
</head>
<body>
        <div>   
                <h3>_Login_</h3>
                <p>Username</p>
                <input type="text" name="" id="">
                <p>Password</p>
                <input type="password" name="" id="">
                <button>Submit</button>

        </div>
</body>
</html>
