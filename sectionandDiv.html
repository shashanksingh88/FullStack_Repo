<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
                section h2{
                        color: rosybrown;
                        text-shadow: 1px 1px 0 black;
                }
                section>h2{
                        text-transform: lowercase;
                }
                h2+p{
                        color: aqua;
                }
                h2~p{
                        text-transform: uppercase;
                }
        </style>
</head>
<body>
        <section>
                <h2>Heading <br><br><br></h2>
                <p>PARAAA <br><br><br></p>
                <p>Para <br><br><br></p>
                <div>
                        <h2>Heading-- <br><br><br></h2>
                </div>
        </section>
</body>
</html>
