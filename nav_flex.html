<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
                body{
                        height: 100vh;
                        display: flex;
                        justify-content: center
                        
                        
                }
                .container{
                        
                        display: flex;
                        flex-wrap: wrap;
                        flex-direction: row;
                        justify-content: flex-end;
                        height: 99px;
                        width: 90vw;
                        align-items: center;
                        min-width: 500px;
                        background-color: black;
                        border-radius: 10px;
                }
                #box1,#box2,#box3,#box4{
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        background-color: black;
                        margin: 1%;
                        color: white;
                        
                        min-width: 65px;
                        height: 30%;
                        background-color: lightblue;
                        border-radius: 10px;
                        
                }
                #img{
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        background-color: black;
                        margin-right: 35%;
                        color: white;
                        
                        min-width: 100px;
                        height: 30%;
                        background-color: lightblue;
                        border-radius: 10px;
                }
        </style>
</head>
<body>

        <div class="container">
                <div id="img">img</div>
                <div id="box1">HOME</div>
                <div id="box2">ABOUT</div>
                <div id="box3">SERVICES</div>
                <div id="box4">CONTACT</div>
                
        </div>
</body>
</html>
