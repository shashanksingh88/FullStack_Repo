<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
                .box1{
                        width:200px;
                        height: 200px;
                        background: linear-gradient(280deg, red, yellow,green,blue);
                        margin-left: auto;
                        margin-right: auto;
                        position:sticky;
                        top: 10px;
                       
                }
                .box2{
                        width: 200px;
                        height: 200px;
                        background: radial-gradient(circle, red, yellow,green,blue);
                        margin-left: auto;
                        margin-right: auto;
                        position: sticky;
                        top: 10px;

                }
                .box3{
                        width: 200px;
                        height: 200px;
                        background: conic-gradient(red, yellow,green,blue);
                        margin-left: auto;
                        margin-right: auto;
                        position: sticky;
                        top: 10px;
                }
        </style>
</head>
<body>
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
</body>
</html>
